<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명지중학교 알림장</title>
<meta http-equiv="refresh" content="0; url=https://mjms-news.vercel.app/">
<link rel="canonical" href="https://mjms-news.vercel.app/">
<script>
  // 옛 주소 /mjms-news/<경로> 를 새 주소의 같은 경로로 넘긴다.
  var p = location.pathname.replace(/^\/mjms-news(?=\/|$)/, '');
  location.replace('https://mjms-news.vercel.app' + (p || '/') + location.search + location.hash);
</script>
</head>
<body>
<p>알림장 주소가 바뀌었습니다: <a href="https://mjms-news.vercel.app/">mjms-news.vercel.app</a></p>
</body>
</html>
